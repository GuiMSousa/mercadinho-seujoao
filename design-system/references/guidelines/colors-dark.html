<!-- @dsCard group="Colors" viewport="700x190" name="Dark theme" subtitle="data-theme=&quot;dark&quot; — surfaces, text, status" -->
<!doctype html><html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px}.v{font-size:11px;color:var(--text-sub)}.p{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:500}</style></head><body>
<div style="display:flex;gap:12px"><div style="flex:1;background:var(--surface-card);border-radius:12px;padding:12px;box-shadow:var(--shadow-sm);border:1px solid var(--border-soft)"><div style="color:var(--text-strong);font-weight:500">text-strong</div><div style="color:var(--text-body)">text-body</div><div style="color:var(--text-sub)">text-sub</div><div style="color:var(--text-soft)">text-soft</div></div>
<div style="flex:1;background:var(--surface-sunken);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start"><span class="p" style="background:var(--success-bg);color:var(--success-fg)">Concluída</span><span class="p" style="background:var(--warning-bg);color:var(--warning-fg)">Vence em 3 dias</span><span class="p" style="background:var(--danger-bg);color:var(--danger-fg)">Vencido</span><span class="p" style="background:var(--info-bg);color:var(--info-fg)">Caixa aberto</span></div>
<div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="height:40px;border-radius:10px;background:var(--action-primary);color:var(--text-inverse);display:flex;align-items:center;justify-content:center;font-weight:500">Continuar</div><div style="height:40px;border-radius:10px;background:var(--action-brand);color:var(--text-on-color);display:flex;align-items:center;justify-content:center;font-weight:500">Abrir caixa</div><div style="height:40px;border-radius:10px;border:1px solid var(--border-default);background:var(--surface-card);color:var(--text-strong);display:flex;align-items:center;justify-content:center;font-weight:500">Filtros</div></div></div>
<div class="v" style="margin-top:8px">bg-app #0A0D14 · surface-card #181B25 · surface-sunken #1F232D · primary inverts to white</div></body></html>
