<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;color:var(--text-strong)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;border:1px solid rgba(14,18,27,.06)}.n{font-size:12px;font-weight:500}.v{font-size:11px;color:var(--text-sub);font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--blue-50)"></div><div class="n">50</div><div class="v">--blue-50</div></div><div class="sw"><div class="chip" style="background:var(--blue-100)"></div><div class="n">100</div><div class="v">--blue-100</div></div><div class="sw"><div class="chip" style="background:var(--blue-200)"></div><div class="n">200</div><div class="v">--blue-200</div></div><div class="sw"><div class="chip" style="background:var(--blue-400)"></div><div class="n">400</div><div class="v">--blue-400</div></div><div class="sw"><div class="chip" style="background:var(--blue-500)"></div><div class="n">500</div><div class="v">--blue-500</div></div><div class="sw"><div class="chip" style="background:var(--blue-600)"></div><div class="n">600</div><div class="v">--blue-600</div></div><div class="sw"><div class="chip" style="background:var(--blue-700)"></div><div class="n">700</div><div class="v">--blue-700</div></div><div class="sw"><div class="chip" style="background:var(--blue-950)"></div><div class="n">950</div><div class="v">--blue-950</div></div></div></body></html>
