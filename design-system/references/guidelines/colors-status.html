<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;color:var(--text-strong)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;border:1px solid rgba(14,18,27,.06)}.n{font-size:12px;font-weight:500}.v{font-size:11px;color:var(--text-sub);font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--success-bg);display:flex;align-items:center;justify-content:center;color:var(--success-fg);font-weight:500;font-size:13px">Concluída</div><div class="n">success</div><div class="v">--success-bg / --success-fg</div></div><div class="sw"><div class="chip" style="background:var(--warning-bg);display:flex;align-items:center;justify-content:center;color:var(--warning-fg);font-weight:500;font-size:13px">Vence em 3 dias</div><div class="n">warning</div><div class="v">--warning-bg / --warning-fg</div></div><div class="sw"><div class="chip" style="background:var(--danger-bg);display:flex;align-items:center;justify-content:center;color:var(--danger-fg);font-weight:500;font-size:13px">Vencido</div><div class="n">danger</div><div class="v">--danger-bg / --danger-fg</div></div><div class="sw"><div class="chip" style="background:var(--info-bg);display:flex;align-items:center;justify-content:center;color:var(--info-fg);font-weight:500;font-size:13px">Caixa aberto</div><div class="n">info</div><div class="v">--info-bg / --info-fg</div></div><div class="sw"><div class="chip" style="background:var(--neutral-bg);display:flex;align-items:center;justify-content:center;color:var(--neutral-fg);font-weight:500;font-size:13px">Rascunho</div><div class="n">neutral</div><div class="v">--neutral-bg / --neutral-fg</div></div></div></body></html>
