<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;color:var(--text-strong)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;border:1px solid rgba(14,18,27,.06)}.n{font-size:12px;font-weight:500}.v{font-size:11px;color:var(--text-sub);font-variant-numeric:tabular-nums}</style></head><body><div style="display:flex;gap:24px;align-items:center"><div style="height:40px;padding:0 16px;border-radius:10px;background:var(--neutral-950);color:#fff;display:flex;align-items:center;box-shadow:var(--focus-ring)">Botão em foco</div><div style="height:40px;width:220px;padding:0 12px;border-radius:10px;border:1px solid var(--blue-500);box-shadow:0 0 0 3px var(--blue-100);display:flex;align-items:center;color:var(--text-soft)">Campo em foco</div></div><div class="v" style="margin-top:12px">Buttons: --focus-ring (keyboard only, :focus-visible). Fields: blue border + 3px blue-100 halo.</div></body></html>
