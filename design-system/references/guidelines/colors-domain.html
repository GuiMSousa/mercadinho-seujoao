<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;color:var(--text-strong)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;border:1px solid rgba(14,18,27,.06)}.n{font-size:12px;font-weight:500}.v{font-size:11px;color:var(--text-sub);font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--money-in)"></div><div class="n">Entrada</div><div class="v">--money-in</div></div><div class="sw"><div class="chip" style="background:var(--money-out)"></div><div class="n">Saída / quebra</div><div class="v">--money-out</div></div><div class="sw"><div class="chip" style="background:var(--money-margin)"></div><div class="n">Margem</div><div class="v">--money-margin</div></div><div class="sw"><div class="chip" style="background:var(--expiry-ok)"></div><div class="n">Validade ok</div><div class="v">--expiry-ok</div></div><div class="sw"><div class="chip" style="background:var(--expiry-soon)"></div><div class="n">A vencer</div><div class="v">--expiry-soon</div></div><div class="sw"><div class="chip" style="background:var(--expiry-expired)"></div><div class="n">Vencido</div><div class="v">--expiry-expired</div></div></div></body></html>
