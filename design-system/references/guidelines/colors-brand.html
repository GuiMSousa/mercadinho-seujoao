<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;color:var(--text-strong)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;border:1px solid rgba(14,18,27,.06)}.n{font-size:12px;font-weight:500}.v{font-size:11px;color:var(--text-sub);font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--blue-500)"></div><div class="n">Blue 500</div><div class="v">--blue-500</div></div><div class="sw"><div class="chip" style="background:var(--red-500)"></div><div class="n">Red 500</div><div class="v">--red-500</div></div><div class="sw"><div class="chip" style="background:var(--orange-500)"></div><div class="n">Orange 500</div><div class="v">--orange-500</div></div><div class="sw"><div class="chip" style="background:var(--green-500)"></div><div class="n">Green 500</div><div class="v">--green-500</div></div><div class="sw"><div class="chip" style="background:var(--neutral-950)"></div><div class="n">Ink 950</div><div class="v">--neutral-950</div></div><div class="sw"><div class="chip" style="background:var(--neutral-0)"></div><div class="n">White</div><div class="v">--neutral-0</div></div></div></body></html>
