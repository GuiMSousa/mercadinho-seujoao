<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{background:var(--bg-app);padding:20px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:16px}.lbl{font-size:11px;color:var(--text-soft);width:72px;flex-shrink:0}</style></head>
<body><div id="root"></div><script type="text/babel">
const NS=window.MktControlDesignSystem_295891;
const {Tabs,SidebarNav,BottomNav}=NS;
function App(){const [t,setT]=React.useState('hoje');const [p,setP]=React.useState('dinheiro');const [s,setS]=React.useState('vendas');const [b,setB]=React.useState('vendas');
return <div style={{display:'flex',gap:16}}>

<div className="col" style={{flex:1}}>
<Tabs items={[{value:'hoje',label:'Hoje'},{value:'7d',label:'7 dias'},{value:'30d',label:'30 dias'}]} value={t} onChange={setT}/>
<Tabs size="counter" fullWidth value={p} onChange={setP} items={[{value:'dinheiro',label:'Dinheiro',icon:'cash-01'},{value:'pix',label:'Pix',icon:'qr-code'},{value:'cartao',label:'Cartão',icon:'credit-card'}]}/>
<BottomNav value={b} onSelect={setB} items={[{value:'vendas',label:'Vendas',icon:'shopping-cart-01'},{value:'caixa',label:'Caixa',icon:'cash-01'},{value:'estoque',label:'Estoque',icon:'package'},{value:'mais',label:'Mais',icon:'menu-01'}]}/>
</div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
