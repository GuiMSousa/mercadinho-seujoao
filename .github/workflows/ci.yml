name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Toolkit checks: focused typed async rules and the local lint-rule self-check.
      - run: npm run lint:typed
      - run: npm run lint:rules
      - run: npm test
      # OpenAPI contract: valid, committed and covering every API route.
      - run: npm run spec:check
      # The build needs no database or secrets: the pool and the session key are read at runtime.
      - run: npm run build
