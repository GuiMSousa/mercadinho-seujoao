name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Throwaway credentials for the CI-only database service below.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mkt_control_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/mkt_control_test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mkt_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mkt_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Schema drift: the committed migrations must already contain what the schema declares.
      - run: npx drizzle-kit generate
      - run: git diff --exit-code -- drizzle
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Toolkit checks: focused typed async rules and the local lint-rule self-check.
      - run: npm run lint:typed
      - run: npm run lint:rules
      - run: npm test
      # OpenAPI contract: valid, committed and covering every API route.
      - run: npm run spec:check
      # The build needs no database or secrets: the pool and the session key are read at runtime.
      - run: npm run build
      # Real-database tests: apply the migrations to the service, then run the *.db.test.ts files.
      - run: npm run db:migrate
      - run: npm run test:db
